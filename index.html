function setLang(lang){let t=translations[lang];document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t[el.dataset.i18n]||'';if(el.dataset.i18n==='contactPending')el.style.whiteSpace='pre-line'});document.title=(lang==='mn'?'Эмэгтэйчүүд, энх тайван, аюулгүй байдлын иргэний нийгмийн эвсэл':'Women, Peace & Security Mongolia');for(let key of ['en','mn']){let b=document.getElementById('lang'+key[0].toUpperCase()+key.slice(1));b.classList.toggle('active',key===lang);b.setAttribute('aria-pressed',String(key===lang))}try{localStorage.setItem('wpslang',lang)}catch(e){}}
document.getElementById('langEn').onclick=()=>setLang('en');document.getElementById('langMn').onclick=()=>setLang('mn');const menuBtn=document.getElementById('menuBtn'),nav=document.getElementById('nav');menuBtn.onclick=()=>{let isOpen=nav.classList.toggle('open');menuBtn.setAttribute('aria-expanded',String(isOpen))};nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{nav.classList.remove('open');menuBtn.setAttribute('aria-expanded','false')}));let initial='mn';try{initial=localStorage.getItem('wpslang')||'mn'}catch(e){}setLang(translations[initial]?initial:'mn');
